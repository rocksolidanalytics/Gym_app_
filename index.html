<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1B2A3A" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Training</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #F2F3EF; }
  #root { min-height: 100vh; }
  .boot { font-family: Inter, system-ui, sans-serif; color: #6E7885; font-size: 13px; padding: 24px; }

  .tb * { box-sizing: border-box; }
  .tb {
    --board: #F2F3EF;
    --ink: #1B2A3A;
    --graphite: #6E7885;
    --rule: #D9DAD3;
    --strength: #2D5FA6;
    --engine: #C7382E;
    --card: #FFFFFF;
    font-family: Inter, system-ui, sans-serif;
    color: var(--ink);
    background: var(--board);
    min-height: 100vh;
    padding: 0 0 76px;
    max-width: 560px;
    margin: 0 auto;
    -webkit-text-size-adjust: 100%;
  }

  .tb header {
    padding: 18px 18px 14px;
    border-bottom: 2px solid var(--ink);
    display: flex;
    align-items: flex-end;
    gap: 14px;
  }
  .tb .wknum {
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    font-size: 62px; line-height: 0.8; font-weight: 700;
    letter-spacing: -0.02em;
  }
  .tb .wklab { font-size: 11px; color: var(--graphite); letter-spacing: 0.06em; }
  .tb .sesstitle {
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    font-size: 27px; font-weight: 600; line-height: 1.05;
  }
  .tb .blocktag { font-size: 12px; color: var(--graphite); margin-top: 3px; }

  .tb .items { padding: 6px 14px 0; }
  .tb .item {
    background: var(--card);
    border: 1px solid var(--rule);
    border-left: 4px solid var(--rule);
    margin: 10px 0;
    padding: 12px 13px;
  }
  .tb .item.strength { border-left-color: var(--strength); }
  .tb .item.engine { border-left-color: var(--engine); }
  .tb .item.plain { background: transparent; border-color: transparent; border-left-color: var(--rule); padding: 8px 13px; }
  .tb .iname { font-weight: 600; font-size: 15px; }
  .tb .idetail { font-size: 13px; color: var(--graphite); margin-top: 3px; line-height: 1.45; }

  .tb .setrow { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .tb .setno {
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    font-size: 17px; color: var(--graphite); width: 18px; font-weight: 600;
  }
  .tb input.num {
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    font-size: 20px; font-weight: 600;
    width: 100%; padding: 7px 8px;
    border: 1px solid var(--rule); background: var(--board);
    color: var(--ink); border-radius: 2px; text-align: center;
  }
  .tb input.num:focus { outline: 2px solid var(--strength); outline-offset: 1px; }
  .tb .unit { font-size: 11px; color: var(--graphite); width: 26px; }
  .tb .ghost { font-size: 12px; color: var(--graphite); margin-top: 7px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

  .tb button.ghostbtn {
    font-family: inherit; font-size: 12px; font-weight: 500;
    background: none; border: 1px solid var(--rule); color: var(--ink);
    padding: 5px 9px; border-radius: 2px; cursor: pointer;
  }
  .tb button.ghostbtn:active { background: var(--board); }

  .tb .tick { display: flex; align-items: center; gap: 9px; margin-top: 9px; }
  .tb .tickbox {
    width: 24px; height: 24px; border: 1.5px solid var(--ink);
    background: none; cursor: pointer; flex: none; border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #fff; padding: 0;
  }
  .tb .tickbox.on { background: var(--ink); }
  .tb .ticklab { font-size: 13px; color: var(--graphite); }

  .tb .timein {
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    font-size: 21px; font-weight: 600; letter-spacing: 0.02em;
    padding: 7px 10px; border: 1px solid var(--rule);
    background: var(--board); color: var(--ink); border-radius: 2px; width: 108px;
  }

  .tb .bigbtn {
    width: calc(100% - 28px); margin: 16px 14px 8px;
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    font-size: 21px; font-weight: 600; letter-spacing: 0.03em;
    padding: 14px; border: none; background: var(--ink); color: var(--board);
    cursor: pointer; border-radius: 2px;
  }
  .tb .bigbtn.done { background: var(--card); color: var(--graphite); border: 1px solid var(--rule); }

  .tb nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    max-width: 560px; margin: 0 auto;
    display: flex; background: var(--card); border-top: 2px solid var(--ink);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tb nav button {
    flex: 1; padding: 13px 4px 15px; background: none; border: none;
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    font-size: 17px; font-weight: 600; color: var(--graphite); cursor: pointer;
  }
  .tb nav button.on { color: var(--ink); box-shadow: inset 0 3px 0 var(--ink); }

  .tb .grid { padding: 12px 14px; }
  .tb .wkrow { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--rule); }
  .tb .wkrow .lab { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 18px; font-weight: 600; width: 62px; }
  .tb .cell {
    flex: 1; padding: 9px 6px; border: 1px solid var(--rule); background: var(--card);
    font-size: 12px; text-align: center; cursor: pointer; border-radius: 2px; color: var(--ink);
    font-family: inherit;
  }
  .tb .cell.done { background: var(--ink); color: var(--board); border-color: var(--ink); }
  .tb .cell.now { outline: 2px solid var(--engine); outline-offset: -2px; }

  .tb .sect { padding: 16px 16px 4px; }
  .tb .secth { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 22px; font-weight: 600; }
  .tb .stat { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 44px; font-weight: 700; line-height: 1; }
  .tb .statlab { font-size: 12px; color: var(--graphite); }
  .tb select, .tb textarea {
    font-family: inherit; font-size: 13px; padding: 7px 9px;
    border: 1px solid var(--rule); background: var(--card); color: var(--ink);
    border-radius: 2px; margin-top: 10px; width: 100%;
  }
  .tb textarea { font-size: 11px; height: 74px; }
  .tb .empty { font-size: 13px; color: var(--graphite); line-height: 1.5; padding: 10px 0 4px; }
  .tb .logline { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--rule); }
  .tb .logline .v { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 17px; font-weight: 600; }
  .tb .btnrow { display: flex; gap: 8px; margin-top: 10px; }
</style>
</head>
<body>
<div id="root"><div class="boot">Loading.</div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* ---------------- programme ---------------- */

const TOTAL_WEEKS = 12;
const blockOf = (w) => (w <= 4 ? "base" : w <= 8 ? "build" : "peak");
const blockName = { base: "Base", build: "Build", peak: "Race sharp" };

const SCHEME = {
  1: { sets: 4, reps: 6, rpe: "7" },
  2: { sets: 4, reps: 6, rpe: "7.5" },
  3: { sets: 5, reps: 5, rpe: "8" },
  4: { sets: 3, reps: 5, rpe: "6", easy: true },
  5: { sets: 4, reps: 5, rpe: "8" },
  6: { sets: 4, reps: 5, rpe: "8.5" },
  7: { sets: 5, reps: 4, rpe: "8.5" },
  8: { sets: 3, reps: 5, rpe: "6", easy: true },
  9: { sets: 5, reps: 3, rpe: "8.5" },
  10: { sets: 5, reps: 3, rpe: "9" },
  11: { sets: 4, reps: 3, rpe: "8" },
  12: { sets: 3, reps: 2, rpe: "9" }
};

const D1_COND = {
  1: "4 rounds: 400 m run, 15 burpees",
  2: "4 rounds: 400 m run, 18 burpees",
  3: "5 rounds: 400 m run, 15 burpees",
  4: "3 rounds: 400 m run, 10 burpees, hold back",
  5: "4 rounds: 500 m run, 15 burpees, 20 walking lunges",
  6: "4 rounds: 600 m run, 15 burpees, 20 walking lunges",
  7: "3 rounds: 800 m run, 18 burpees, 20 sandbag lunges",
  8: "3 rounds: 500 m run, 10 burpees, hold back",
  9: "3 rounds: 800 m run, 15 burpees, 50 m sled push",
  10: "3 rounds: 1 km run, 15 burpees, 50 m sled push",
  11: "Half sim: 3 x 1 km run, station after each (ski, sled push, burpee broad jumps)",
  12: "Test piece: 1 km run, 35 burpees, 1 km run"
};

const D2_MAIN = {
  1: "4 x 1000 m row, 2 min easy between",
  2: "5 x 1000 m row, 2 min easy between",
  3: "3 x 1500 m row, 3 min easy between",
  4: "15 min steady row, nose breathing only",
  5: "4 x 1000 m ski, 90 s between",
  6: "5 x 1000 m ski, 90 s between",
  7: "2 rounds: 1000 m row then 1000 m ski, 3 min between",
  8: "15 min steady bike, conversational",
  9: "4 x 1 km run at race pace, 2 min between",
  10: "5 x 1 km run at race pace, 2 min between",
  11: "2 rounds: 1 km run then 1000 m row at race pace",
  12: "2 x 1000 m row for time, full recovery between"
};

const D2_STATIONS = {
  base: "3 rounds: 250 m ski, 50 m sled push, 15 burpee broad jumps",
  build: "3 rounds: 500 m ski, 50 m sled push, 50 m sled pull, 20 burpee broad jumps",
  peak: "3 rounds: 500 m ski, 50 m sled pull, 20 burpee broad jumps, 100 m farmers carry"
};

const D3_FINISHER = {
  base: "6 min EMOM: odd minute 10 burpees, even minute 15 kettlebell swings",
  build: "8 min EMOM: odd minute 12 burpees, even minute 18 kettlebell swings",
  peak: "8 min EMOM: 12 burpees, then 20 kettlebell swings"
};

function estimateMins(week, day) {
  if (SCHEME[week].easy) return 35;
  if (day === 1) return blockOf(week) === "peak" ? 52 : 48;
  if (day === 2) return 47;
  return 48;
}

function buildSession(week, day) {
  const sc = SCHEME[week];
  const blk = blockOf(week);
  const liftLabel = sc.sets + " x " + sc.reps + " at RPE " + sc.rpe;
  const mins = estimateMins(week, day);

  if (day === 1) {
    return {
      title: "Legs and legs again",
      mins: mins,
      items: [
        { id: "wu1", kind: "note", name: "Warm up", detail: "5 min bike, then ankles and hips, two ramp up squat sets" },
        { id: "squat", kind: "lift", name: "Back squat", detail: liftLabel, sets: sc.sets },
        { id: "rdl", kind: "lift", name: "Romanian deadlift", detail: (sc.easy ? "2 x 8" : "3 x 8") + ", straight into 12 hanging knee raises, no rest between", sets: sc.easy ? 2 : 3 },
        { id: "cond1", kind: "work", name: "Conditioning", detail: D1_COND[week] }
      ]
    };
  }

  if (day === 2) {
    return {
      title: "Engine",
      mins: mins,
      items: [
        { id: "wu2", kind: "note", name: "Warm up", detail: "5 min easy bike, then 3 x 20 s hard" },
        { id: "intervals", kind: "work", name: "Main intervals", detail: D2_MAIN[week] },
        { id: "stations", kind: "work", name: "Stations", detail: D2_STATIONS[blk] },
        { id: "cd2", kind: "note", name: "Cool down", detail: "5 min easy spin, nose breathing" }
      ]
    };
  }

  return {
    title: "Push, pull, pump",
    mins: mins,
    items: [
      { id: "wu3", kind: "note", name: "Warm up", detail: "5 min row, band pull aparts, two ramp up press sets" },
      { id: "bench", kind: "lift", name: "Bench press", detail: liftLabel, sets: sc.sets },
      { id: "pull", kind: "lift", name: "Weighted pull up or lat pulldown", detail: "3 x 8, alternate sets with the shoulder press below", sets: 3 },
      { id: "ohp", kind: "lift", name: "Dumbbell shoulder press", detail: "3 x 10, alternate sets with the pull ups, no extra rest", sets: 3 },
      { id: "curl", kind: "lift", name: "Incline curl", detail: "3 x 12, first of three arm movements run back to back", sets: 3 },
      { id: "raise", kind: "lift", name: "Lateral raise", detail: "3 x 15, straight after the curls", sets: 3 },
      { id: "arms", kind: "note", name: "Triceps", detail: "3 x 15 cable pushdown, straight after the raises, then rest 90 s and repeat" },
      { id: "fin3", kind: "work", name: "Finisher", detail: D3_FINISHER[blk] }
    ]
  };
}

const LIFT_NAMES = {
  squat: "Back squat",
  rdl: "Romanian deadlift",
  bench: "Bench press",
  pull: "Pull up",
  ohp: "Shoulder press",
  curl: "Incline curl",
  raise: "Lateral raise"
};

const key = (w, d) => "w" + w + "d" + d;
const e1rm = (w, r) => (r > 0 && w > 0 ? w * (1 + r / 30) : 0);

/* ---------------- storage ---------------- */

const STORE_KEY = "training:v1";
const emptyState = { pointer: { week: 1, day: 1 }, log: {} };
let memoryFallback = null;

function loadState() {
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {
    if (memoryFallback) return memoryFallback;
  }
  return null;
}

function saveState(state) {
  memoryFallback = state;
  try {
    window.localStorage.setItem(STORE_KEY, JSON.stringify(state));
    return true;
  } catch (e) {
    return false;
  }
}

/* ---------------- pieces ---------------- */

function SetRows({ item, entry, prev, onSet, onRepeat }) {
  const sets = entry && entry.sets ? entry.sets : [];
  const hasPrev = prev && prev.sets && prev.sets.some((s) => s && s.w);
  return (
    <div>
      {Array.from({ length: item.sets }).map((_, i) => {
        const s = sets[i] || {};
        const p = hasPrev ? prev.sets[i] || {} : {};
        return (
          <div className="setrow" key={i}>
            <span className="setno">{i + 1}</span>
            <input
              className="num"
              inputMode="decimal"
              value={s.w == null ? "" : s.w}
              placeholder={p.w != null ? String(p.w) : ""}
              onChange={(e) => onSet(i, "w", e.target.value)}
              aria-label={"Set " + (i + 1) + " weight"}
            />
            <span className="unit">kg</span>
            <input
              className="num"
              inputMode="numeric"
              value={s.r == null ? "" : s.r}
              placeholder={p.r != null ? String(p.r) : ""}
              onChange={(e) => onSet(i, "r", e.target.value)}
              aria-label={"Set " + (i + 1) + " reps"}
            />
            <span className="unit">reps</span>
          </div>
        );
      })}
      {hasPrev && (
        <div className="ghost">
          <span>
            Last time: {prev.sets.filter((x) => x && x.w).map((x) => x.w + " x " + (x.r || "?")).join(", ")}
          </span>
          <button className="ghostbtn" onClick={onRepeat}>Copy</button>
        </div>
      )}
    </div>
  );
}

function Chart({ points }) {
  if (points.length < 2) return null;
  const w = 320, h = 110, pad = 8;
  const ys = points.map((p) => p.y);
  const min = Math.min.apply(null, ys) * 0.96;
  const max = Math.max.apply(null, ys) * 1.04;
  const span = max - min || 1;
  const x = (i) => pad + (i * (w - pad * 2)) / (points.length - 1);
  const y = (v) => h - pad - ((v - min) / span) * (h - pad * 2);
  const d = points.map((p, i) => (i ? "L" : "M") + x(i) + " " + y(p.y)).join(" ");
  return (
    <svg viewBox={"0 0 " + w + " " + h} style={{ width: "100%", marginTop: 10 }} role="img" aria-label="Estimated one rep max over time">
      <line x1={pad} y1={h - pad} x2={w - pad} y2={h - pad} stroke="#D9DAD3" strokeWidth="1" />
      <path d={d} fill="none" stroke="#2D5FA6" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {points.map((p, i) => (
        <circle key={i} cx={x(i)} cy={y(p.y)} r="3.5" fill="#F2F3EF" stroke="#2D5FA6" strokeWidth="2" />
      ))}
    </svg>
  );
}

/* ---------------- app ---------------- */

function App() {
  const [state, setState] = useState(() => loadState() || emptyState);
  const [tab, setTab] = useState("today");
  const [lift, setLift] = useState("squat");
  const [backup, setBackup] = useState("");
  const [msg, setMsg] = useState("");

  useEffect(() => { saveState(state); }, [state]);

  const week = state.pointer.week;
  const day = state.pointer.day;
  const session = useMemo(() => buildSession(week, day), [week, day]);
  const entryKey = key(week, day);
  const entry = state.log[entryKey] || { items: {} };

  const prevFor = (itemId) => {
    for (let w = week; w >= 1; w--) {
      for (let d = 3; d >= 1; d--) {
        if (w === week && d >= day) continue;
        const rec = state.log[key(w, d)];
        if (rec && rec.items && rec.items[itemId]) return rec.items[itemId];
      }
    }
    return null;
  };

  const update = (itemId, updater) =>
    setState((st) => {
      const log = Object.assign({}, st.log);
      const rec = log[entryKey] ? Object.assign({}, log[entryKey]) : { items: {}, done: false };
      const items = Object.assign({}, rec.items);
      items[itemId] = updater(items[itemId] || {});
      rec.items = items;
      rec.date = rec.date || new Date().toISOString().slice(0, 10);
      log[entryKey] = rec;
      return Object.assign({}, st, { log });
    });

  const setCell = (item, i, field, val) =>
    update(item.id, (cur) => {
      const sets = (cur.sets || []).slice();
      while (sets.length < item.sets) sets.push({});
      const next = Object.assign({}, sets[i]);
      next[field] = val === "" ? null : Number(val);
      sets[i] = next;
      return Object.assign({}, cur, { sets });
    });

  const repeat = (item) => {
    const p = prevFor(item.id);
    if (p && p.sets) update(item.id, (cur) => Object.assign({}, cur, { sets: p.sets.map((s) => Object.assign({}, s)) }));
  };

  const finish = () =>
    setState((st) => {
      const log = Object.assign({}, st.log);
      const rec = log[entryKey] ? Object.assign({}, log[entryKey]) : { items: {} };
      rec.done = !rec.done;
      rec.date = rec.date || new Date().toISOString().slice(0, 10);
      log[entryKey] = rec;
      let pointer = st.pointer;
      if (rec.done) {
        pointer = day < 3 ? { week: week, day: day + 1 } : week < TOTAL_WEEKS ? { week: week + 1, day: 1 } : st.pointer;
      }
      return Object.assign({}, st, { log: log, pointer: pointer });
    });

  const doneCount = Object.keys(state.log).filter((k) => state.log[k].done).length;

  const liftsWithData = useMemo(() => {
    const ids = [];
    Object.keys(state.log).forEach((k) => {
      const items = state.log[k].items || {};
      Object.keys(items).forEach((id) => {
        const v = items[id];
        if (LIFT_NAMES[id] && v.sets && v.sets.some((s) => s && s.w && s.r) && ids.indexOf(id) === -1) ids.push(id);
      });
    });
    return ids;
  }, [state.log]);

  const liftPoints = useMemo(() => {
    const out = [];
    for (let w = 1; w <= TOTAL_WEEKS; w++) {
      for (let d = 1; d <= 3; d++) {
        const rec = state.log[key(w, d)];
        const it = rec && rec.items && rec.items[lift];
        if (it && it.sets) {
          const vals = it.sets.filter((s) => s && s.w && s.r).map((s) => e1rm(s.w, s.r));
          const best = vals.length ? Math.max.apply(null, vals) : 0;
          if (best > 0) out.push({ label: "W" + w, y: Math.round(best) });
        }
      }
    }
    return out;
  }, [state.log, lift]);

  const workLog = useMemo(() => {
    const out = [];
    for (let w = 1; w <= TOTAL_WEEKS; w++) {
      for (let d = 1; d <= 3; d++) {
        const rec = state.log[key(w, d)];
        if (!rec) continue;
        const items = rec.items || {};
        Object.keys(items).forEach((id) => {
          if (items[id].result) {
            const def = buildSession(w, d).items.filter((x) => x.id === id)[0];
            out.push({ when: "Week " + w + ", day " + d, name: def ? def.name : id, result: items[id].result });
          }
        });
      }
    }
    return out.reverse();
  }, [state.log]);

  const restore = () => {
    try {
      const parsed = JSON.parse(backup);
      if (!parsed || !parsed.log) throw new Error("bad shape");
      setState(parsed);
      setMsg("Log restored.");
    } catch (e) {
      setMsg("That text is not a valid backup. Paste the whole block you copied.");
    }
  };

  return (
    <div className="tb">
      <header>
        <div>
          <div className="wklab">WEEK</div>
          <div className="wknum">{week}</div>
        </div>
        <div style={{ flex: 1 }}>
          <div className="sesstitle">{session.title}</div>
          <div className="blocktag">
            {blockName[blockOf(week)]} block, day {day} of 3{SCHEME[week].easy ? ", lighter week" : ""}
            <span style={{ display: "block", marginTop: 2 }}>about {session.mins} min</span>
          </div>
        </div>
      </header>

      {tab === "today" && (
        <React.Fragment>
          <div className="items">
            {session.items.map((item) => {
              const it = entry.items[item.id] || {};
              const cls = item.kind === "note" ? "item plain" : item.kind === "work" ? "item engine" : "item strength";
              return (
                <div className={cls} key={item.id}>
                  <div className="iname">{item.name}</div>
                  <div className="idetail">{item.detail}</div>

                  {item.kind === "lift" && (
                    <SetRows
                      item={item}
                      entry={it}
                      prev={prevFor(item.id)}
                      onSet={(i, f, v) => setCell(item, i, f, v)}
                      onRepeat={() => repeat(item)}
                    />
                  )}

                  {item.kind === "work" && (
                    <div className="setrow" style={{ marginTop: 10 }}>
                      <input
                        className="timein"
                        placeholder="mm:ss"
                        value={it.result || ""}
                        onChange={(e) => update(item.id, (c) => Object.assign({}, c, { result: e.target.value }))}
                        aria-label="Time or score"
                      />
                      <span className="unit" style={{ width: "auto" }}>time or score</span>
                    </div>
                  )}

                  {item.kind === "note" && (
                    <div className="tick">
                      <button
                        className={"tickbox" + (it.done ? " on" : "")}
                        onClick={() => update(item.id, (c) => Object.assign({}, c, { done: !c.done }))}
                        aria-pressed={!!it.done}
                        aria-label={"Mark " + item.name + " complete"}
                      >
                        {it.done ? "\u2713" : ""}
                      </button>
                      <span className="ticklab">{it.done ? "Done" : "Tap when complete"}</span>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          <button className={"bigbtn" + (entry.done ? " done" : "")} onClick={finish}>
            {entry.done ? "Session logged, tap to reopen" : "Finish session"}
          </button>
        </React.Fragment>
      )}

      {tab === "plan" && (
        <div className="grid">
          {Array.from({ length: TOTAL_WEEKS }).map((_, wi) => {
            const w = wi + 1;
            return (
              <div className="wkrow" key={w}>
                <div className="lab">Wk {w}{SCHEME[w].easy ? "*" : ""}</div>
                {[1, 2, 3].map((d) => {
                  const rec = state.log[key(w, d)];
                  const now = w === week && d === day;
                  return (
                    <button
                      key={d}
                      className={"cell" + (rec && rec.done ? " done" : "") + (now ? " now" : "")}
                      onClick={() => {
                        setState((st) => Object.assign({}, st, { pointer: { week: w, day: d } }));
                        setTab("today");
                      }}
                    >
                      {buildSession(w, d).title.split(" ")[0]}
                    </button>
                  );
                })}
              </div>
            );
          })}
          <div className="empty">
            Weeks 4 and 8 are marked with a star. They are lighter on purpose, so resist the urge to push them.
            Tap any session to open it.
          </div>
        </div>
      )}

      {tab === "progress" && (
        <div>
          <div className="sect">
            <div className="stat">
              {doneCount}<span style={{ fontSize: 20, color: "#6E7885" }}> / 36</span>
            </div>
            <div className="statlab">sessions logged</div>
          </div>

          <div className="sect">
            <div className="secth">Strength</div>
            {liftsWithData.length === 0 ? (
              <div className="empty">Log a few sets and your estimated one rep max will chart here.</div>
            ) : (
              <React.Fragment>
                <select value={lift} onChange={(e) => setLift(e.target.value)}>
                  {liftsWithData.map((id) => (
                    <option key={id} value={id}>{LIFT_NAMES[id]}</option>
                  ))}
                </select>
                {liftPoints.length < 2 ? (
                  <div className="empty">One session in. Log another and the trend appears.</div>
                ) : (
                  <React.Fragment>
                    <Chart points={liftPoints} />
                    <div className="statlab">
                      Estimated one rep max, {liftPoints[0].y} kg to {liftPoints[liftPoints.length - 1].y} kg
                    </div>
                  </React.Fragment>
                )}
              </React.Fragment>
            )}
          </div>

          <div className="sect">
            <div className="secth">Conditioning</div>
            {workLog.length === 0 ? (
              <div className="empty">Times and scores you record on engine work land here, newest first.</div>
            ) : (
              workLog.slice(0, 25).map((r, i) => (
                <div className="logline" key={i}>
                  <span>{r.name}<span style={{ color: "#6E7885" }}> · {r.when}</span></span>
                  <span className="v">{r.result}</span>
                </div>
              ))
            )}
          </div>

          <div className="sect" style={{ paddingBottom: 20 }}>
            <div className="secth">Backup</div>
            <div className="empty">
              Your log lives in this browser only. Copy it out now and then, and keep it somewhere safe.
            </div>
            <div className="btnrow">
              <button className="ghostbtn" onClick={() => { setBackup(JSON.stringify(state)); setMsg("Backup written below. Copy it."); }}>
                Create backup
              </button>
              <button className="ghostbtn" onClick={restore} disabled={!backup}>
                Restore from text
              </button>
            </div>
            <textarea
              value={backup}
              onChange={(e) => setBackup(e.target.value)}
              placeholder="Backup text appears here, or paste an old backup in to restore it"
              aria-label="Backup text"
            />
            {msg ? <div className="statlab">{msg}</div> : null}
          </div>
        </div>
      )}

      <nav>
        <button className={tab === "today" ? "on" : ""} onClick={() => setTab("today")}>Today</button>
        <button className={tab === "plan" ? "on" : ""} onClick={() => setTab("plan")}>Plan</button>
        <button className={tab === "progress" ? "on" : ""} onClick={() => setTab("progress")}>Progress</button>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
